name         = "M_unicode"
version      = "2.0.0"
license      = "MIT"
author       = "John S. Urban"
maintainer   = "urbanjost@comcast.net"
copyright    = "Copyright 2025,2026 John S. Urban"
description  = "UTF-8 encoded string processing"
categories   = ["strings"]
keywords     = ["fortran", "strings","Unicode","UTF-8", "utf8", "internationalization", "i18n" ]
homepage     = "https://github.com/urbanjost/M_unicode.git"

[build]
   #auto-executables = true
   #auto-tests = true
   #auto-examples = true
   #module-naming = true
   #external-modules = ["ifport", "dfport"]

[install]
   library = true

[[executable]]
   name="uni"
   source-dir="app"
   main="uni.f90"
   [executable.dependencies]
       M_CLI2 = { git = "https://github.com/urbanjost/M_CLI2.git" }
      #M_CLI2 = { path = "GLINKS/M_CLI2" }
      #M_CLI2 = { namespace = "GPF" }
